<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Tuần Hoàn Nguyên tố Hoá Học</title>

    <script src="https://kit.fontawesome.com/6baff69dac.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    {% block metadescription %}
    <meta name="description" content="Bảng Hệ thống tuần hoàn các nguyên tố hoá học theo chương trình giáo dục mới">
    {% endblock metadescription %}

    <style>
    /* HTML PART */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #0f172a; /* Sleek dark background */
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

    /* NAVBAR & PAGE WRAPPER */
        #page-wrapper {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 12px 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            width: 100%;
            background-color: #1e293b; /* Modern dark navbar */
            border-bottom: 1px solid #334155;
        }

        .navbar-brand {
            font-size: clamp(1.2rem, 4vw, 1.5rem) !important;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            margin-right: 0 !important;
            text-decoration: none;
        }

        .title-web {
            color: #60a5fa; /* Vibrant blue accent */
            letter-spacing: 0.5px;
        }
    </style>

</head>
<body>
    <div id="page-wrapper">
        <nav class='navbar'>
            <div class='container-fluid'>
                <div class="d-flex align-items-center justify-content-between w-100">
                    <a class='navbar-brand' href="{% url 'webs:index' %}">
                        <span class="title-web"><i class="fa-solid fa-atom me-2"></i>Bảng Tuần hoàn</span>
                    </a>
                </div>
            </div>
        </nav>
        <div class="container-fluid my-4 px-4">
            {% block content %}
            {% endblock content %}
        </div>
    </div>
</body>
</html>
