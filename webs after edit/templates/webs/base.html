<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#08111f">
    <title>{% block title %}Nguyên Tố | Bảng tuần hoàn hóa học{% endblock %}</title>
    <meta name="description" content="Khám phá bảng tuần hoàn 118 nguyên tố hóa học, tra cứu thông tin và luyện tập kiến thức hóa học.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
      :root{color-scheme:dark;--bg:#08111f;--panel:#101d30;--line:#26364c;--text:#edf4ff;--muted:#9aacc4;--accent:#66e3c4}
      *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:radial-gradient(ellipse at 50% -20%,#19304c 0,transparent 55%),var(--bg);color:var(--text);font-family:'Be Vietnam Pro',system-ui,sans-serif;min-height:100vh}
      .site-nav{position:sticky;top:0;z-index:50;background:rgba(8,17,31,.86);backdrop-filter:blur(16px);border-bottom:1px solid rgba(154,172,196,.15)}
      .nav-inner{max-width:1500px;margin:auto;padding:15px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
      .brand{color:var(--text);font-weight:800;text-decoration:none;letter-spacing:-.4px;font-size:1.1rem}.brand-mark{display:inline-grid;place-items:center;width:38px;height:38px;margin-right:10px;border-radius:12px;background:linear-gradient(135deg,#65e6c5,#63a8ff);color:#071322}
      .nav-tag{color:var(--muted);font-size:.82rem}.page-shell{max-width:1500px;margin:0 auto;padding:32px 24px 50px}
      .site-footer{border-top:1px solid rgba(154,172,196,.15);padding:22px 24px;text-align:center;color:var(--muted);font-size:.83rem}
      @media(max-width:600px){.nav-inner{padding:12px 16px}.nav-tag{display:none}.page-shell{padding:24px 14px 35px}}
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<header class="site-nav"><div class="nav-inner">
  <a class="brand" href="{% url 'webs:index' %}"><span class="brand-mark"><i class="fa-solid fa-atom"></i></span>NGUYÊN TỐ<span style="color:var(--accent)">.</span></a>
  <span class="nav-tag"><i class="fa-solid fa-flask me-2"></i>Không gian khám phá hóa học</span>
</div></header>
<main class="page-shell">{% block content %}{% endblock %}</main>
<footer class="site-footer">Dự án cộng tác của <strong style="color:var(--text)">Kim Thư &amp; Hoàng Nhân</strong> · Học hỏi hôm nay, khám phá ngày mai.</footer>
{% block scripts %}{% endblock %}
</body>
</html>
